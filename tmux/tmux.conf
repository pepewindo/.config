# Set the prefix to ctrl-n
set -g prefix C-Space

# Remove the old prefix
unbind C-b

# Send Ctrl-s to applications by pressing it twice
bind C-Space send-prefix

# reload config file (change file location to your the tmux.conf you want to use)
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!";

# bash command to retrieve colours
# for i in {0..255}; do
#    printf '\x1b[38;5;%dmcolour%d\x1b[0m\n' $i $i
# done

set -g status-position top

# Add some colors
set -g status-bg colour234 # status bar background color
set -g status-fg colour111 # status bar foreground color
set -g window-status-style bg=colour234 # inactive window
set -g window-status-current-style bg=colour111,fg=colour234 # active window

# Enable Mouse
set -g mouse on


# split panes using | and -
bind v split-window -h
bind s split-window -v
unbind '"'
unbind %

## switch panes using Alt-arrow without prefix
#bind -n M-Left select-pane -L
#bind -n M-Right select-pane -R
#bind -n M-Up select-pane -U
#bind -n M-Down select-pane -D
# switch panes using Ctrl-arrow without prefix
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# act like vim (also)
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind Space last-window 
bind-key C-Space switch-client -l

#panes
set -g pane-active-border-style 'fg=colour111'

# Start counting pane and window number at 1, auto renumbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind -r C-Down resize-pane -D 5
bind -r C-Up resize-pane -U 5
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5




