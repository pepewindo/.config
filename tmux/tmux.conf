# Set the prefix to ctrl-n
set -g prefix C-Space

# Remove the old prefix
unbind C-b

# Send Ctrl-s to applications by pressing it twice
bind C-Space send-prefix

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!";

# Add some colors
set -g status-bg cyan # status bar background color
set -g window-status-style bg=yellow # inactive window
set -g window-status-current-style bg=red,fg=white # active window

# Enable Mouse
set -g mouse on


# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind Space last-window 
bind-key C-Space switch-client -l

#panes
#set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# Start counting pane and window number at 1, auto renumbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind -r C-Down resize-pane -D 5
bind -r C-Up resize-pane -U 5
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
