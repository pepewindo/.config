theme = "pepew"

[editor]
  color-modes = true
  true-color  = true
  line-number = "relative"
  mouse       = true
  bufferline  = "multiple"
  end-of-line-diagnostics = "hint"

[editor.inline-diagnostics]
  cursor-line = "warning"

[editor.lsp]
  display-inlay-hints = true

[editor.soft-wrap]
  enable = true

[editor.cursor-shape]
  insert = "bar"
  normal = "block"
  select = "underline"

[editor.file-picker]
  hidden = false

[editor.statusline]
  left = ["mode", "spinner"]
  center = ["file-name"]
  right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
  separator = "│"
  # mode.normal = "NORMAL"
  # mode.insert = "INSERT"
  # mode.select = "SELECT"
  diagnostics = ["warning", "error"]
  workspace-diagnostics = ["warning", "error"]

[editor.indent-guides]
  render = true
  character = "┊" # Some characters that work well: "╎", "▏", "┆", "┊", "⸽"
  skip-levels = 1

[keys.normal]
  C-p     = "jump_forward" # jump forward in the jump list, mirror of C-o, Ergol intuitive, no conflict in picker mode
  C-left  = "jump_view_left"
  C-right = "jump_view_right"
  C-up    = "jump_view_up"
  C-down  = "jump_view_down"
  A-z     = "rotate_selection_contents_backward"
  A-v     = "rotate_selection_contents_forward"
  A-l     = "repeat_last_motion"
  A-r     = "flip_selections"
  A-t     = "ensure_selections_forward"
  "}"     = "goto_next_paragraph"
  "{"     = "goto_prev_paragraph"
  "X"     = "select_line_above"
  C-l     = ":lsp-stop"

[keys.normal."space"]
  l = ":lsp-restart"
  u = ":reset-diff-change"

[keys.normal.g]
  "," = "goto_line_end"
[keys.select.g]
  "," = "goto_line_end"

[keys.normal.m.n]
  d = '@f"lmi"'
  q = "@f'lmi'" 

[keys.normal.m.n.a]
  q = "@f'lma'" 
  d = '@f"lma"'

[keys.insert]
  C-backspace = "delete_word_backward"
  C-right     = "move_next_long_word_end"
  C-left      = "move_prev_long_word_start"

[keys.select]
  "}" = "goto_next_paragraph"
  "{" = "goto_prev_paragraph"
  "X" = "select_line_above"
